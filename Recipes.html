<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Kompanion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="Recipes.css" />
    <script src="Recipes.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Keyboard&family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="device">
      <!-- HEADER -->
      <div class="recipes-header">
        <div class="recipes-top">
          <div class="title">
            <h1>Recipes</h1>
          </div>
          <img class="logo" src="/icons/leaves.png" />
        </div>

        <hr class="header-line" />
        <div class="search-bar">
          <img class="search-icon" src="/icons/search.png" />
          Search...
          <img class="filter-icon" src="/icons/filter.png" />
          <hr class="search-line" />
        </div>
      </div>
      <!-- HEADER -->

      <div id="recipe-scroll">
        <img
          id="add-button"
          src="/icons/add.png"
          width="50"
          height="50"
          onclick="openRecipeForm()"
        />

        <!-- add recipe form -->
        <div id="add-form">
          <h1>Add Recipe</h1>

          <!-- general -->
          <fieldset class="fieldset">
            <legend>General</legend>
            <label for="recipe-name">Recipe Name</label>
            <input type="text" id="recipe-name" />
            <label for="difficulty">Difficulty</label>
            <select name="difficulty" id="difficulty" required>
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
            <label for="duration">Duration</label>
            <input type="text" id="duration" />
          </fieldset>

          <!-- ingredients -->

          <fieldset class="fieldset">
            <legend>Ingredients</legend>

            <div id="ingredients">
              <div id="ingredients-list"></div>

              <!-- bottom unit, will always be here -->
              <div id="add-ingredient">
                <img
                  id="add-ingredient-button"
                  src="/icons/add.png"
                  width="25"
                  height="25"
                  onclick="addIngredient()"
                />
                <input
                  type="text"
                  id="add-ingredient-text"
                  placeholder="Ingredients here..."
                  maxlength="50"
                />
              </div>
            </div>
          </fieldset>

          <!-- instructions -->
          <fieldset class="fieldset">
            <legend>Instructions</legend>

            <div id="instructions">
              <div id="instructions-list"></div>

              <!-- bottom instruction unit, will always be here -->
              <div id="add-instruction">
                <img
                  id="add-instruction-button"
                  src="/icons/add.png"
                  width="25"
                  height="25"
                  onclick="addInstruction()"
                />
                <input
                  type="text"
                  id="add-instruction-text"
                  placeholder="Instruction here..."
                  maxlength="100"
                />
              </div>
            </div>
          </fieldset>

          <submit id="submit-recipe" onclick="addRecipe()"
            >Submit Recipe</submit
          >
        </div>

        <!-- recipe unit -->
        
    </div>
    <footer>
      <button
        class="tablink"
        onclick="window.location.href = 'text.html'"
        id=" defaultOpen"
      >
        <img src="icons/settings.png" width="50" height="50" />
        <p1>Home</p1>
      </button>
      <button class="tablink" onclick="window.location.href = 'LR.html'">
        <img src="icons/grocery.png" width="50" height="50" />
        <p1>Inventory</p1>
      </button>
      <button
        class="tablink"
        onclick="window.location.href = 'Grocery_tab.html'"
      >
        <img src="icons/recipe-book.png" width="50" height="50" />
        <p1>Groceries</p1>
      </button>
      <button class="tablink" onclick="window.location.href = 'Choices.html'">
        <img src="icons/spatula.png" width="50" height="50" />
        <p1>Recipes</p1>
      </button>
      <!-- <button class="tablink" onclick="window.location.href='Profile.html'">
            <img src="icons/user.png" width="50" height="50">
            <p1>Profile</p1>
        </button> -->
    </footer>
  </body>
</html>
