<!DOCTYPE html>
<html lang=en>

<head>
    <title>My Household</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="MyHousehold.css">
</head>

<body>
    <div class="device">
        <div class="header">
            <div class="header_logo">
                <img class="header_logo" src="icons/leaves.svg" width="50" height="50">
                <h1>My Household</h1>
            </div>
        </div>

        <!-- Household Members -->
        <div class="content profile_content">
            <div class="widget">
                <div class="widget_header">
                    <h2>Household Members</h2>
                    <button class="add_button" id="addProfileButton">+ Add</button>
                </div>
                <div id="profileList"></div>
            </div>

            <!-- Chores -->
            <div class="widget">
                <div class="widget_header">
                    <h2>Chores</h2>
                    <button class="add_button" id="addChoreButton">+ Add</button>
                </div>
                <div class="chore_filters">
                    <button class="chore_filter active" data-category="All">All</button>
                    <button class="chore_filter" data-category="Cleaning">Cleaning</button>
                    <button class="chore_filter" data-category="Trash Duty">Trash Duty</button>
                    <button class="chore_filter" data-category="Shopping">Shopping</button>
                </div>
                <div id="choreList"></div>
            </div>
        </div>

        <!-- Adding or editing a Household Member -->
        <dialog class="household_dialog" id="profileDialog">
            <form id="profileForm">
                <h1 id="profileTitle">Add Member</h1>

                <fieldset>
                    <legend>General</legend>
                    <label for="profileName">Name</label>
                    <input type="text" id="profileName" maxlength="30" required>

                    <label for="profileSkill">Cooking Skill</label>
                    <select id="profileSkill">
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Allergies</legend>
                    <div class="allergy_options">
                        <label><input type="checkbox" name="allergy" value="Peanuts"> Peanuts</label>
                        <label><input type="checkbox" name="allergy" value="Tree Nuts"> Tree Nuts</label>
                        <label><input type="checkbox" name="allergy" value="Dairy"> Dairy</label>
                        <label><input type="checkbox" name="allergy" value="Eggs"> Eggs</label>
                        <label><input type="checkbox" name="allergy" value="Gluten"> Gluten</label>
                        <label><input type="checkbox" name="allergy" value="Soy"> Soy</label>
                        <label><input type="checkbox" name="allergy" value="Fish"> Fish</label>
                        <label><input type="checkbox" name="allergy" value="Shellfish"> Shellfish</label>
                    </div>
                    <label for="profileOtherAllergies">Other</label>
                    <input type="text" id="profileOtherAllergies" placeholder="Other allergies (comma-separated)">
                </fieldset>

                <div class="dialog_buttons">
                    <button type="submit">Save</button>
                    <button type="button" id="profileCancel">Cancel</button>
                </div>
            </form>
        </dialog>

        <!-- Adding a chore -->
        <dialog class="household_dialog" id="choreDialog">
            <form id="choreForm">
                <h1>Add Chore</h1>

                <fieldset>
                    <legend>General</legend>
                    <label for="choreName">Chore</label>
                    <input type="text" id="choreName" maxlength="40" required>

                    <label for="choreCategory">Category</label>
                    <select id="choreCategory">
                        <option>Cleaning</option>
                        <option>Trash Duty</option>
                        <option>Shopping</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Schedule</legend>
                    <label for="chorePerson">Assigned To</label>
                    <select id="chorePerson"></select>

                    <label for="choreDay">Due</label>
                    <select id="choreDay">
                        <option>Sun</option>
                        <option>Mon</option>
                        <option>Tue</option>
                        <option>Wed</option>
                        <option>Thu</option>
                        <option>Fri</option>
                        <option>Sat</option>
                    </select>
                </fieldset>

                <div class="dialog_buttons">
                    <button type="submit">Save</button>
                    <button type="button" id="choreCancel">Cancel</button>
                </div>
            </form>
        </dialog>


        <footer>
            <button class="tablink" onclick="window.location.href='index.html'">
                <img class="tablink_icon" src="icons/inventory.svg" width="50" height="50">
                <p1>Inventory</p1>
            </button>
            <button class="tablink" onclick="window.location.href='Grocery_tab.html'">
                <img class="tablink_icon" src="icons/groceries.svg" width="50" height="50">
                <p1>Groceries</p1>
            </button>
            <button class="tablink" onclick="window.location.href='Recipes.html'">
                <img class="tablink_icon" src="icons/recipes.svg" width="50" height="50">
                <p1>Recipes</p1>
            </button>
            <button class="tablink active" onclick="window.location.href='MyHousehold.html'" id=" defaultOpen">
                <img class="tablink_icon" src="icons/home.svg" width="50" height="50">
                <p1>My Household</p1>
            </button>
        </footer>

        <img class="Keyboard" src="icons/keyboard.png">
    </div>

    <script src="MyHousehold.js"></script>
</body>
</html>
