<body>
    <script>


        function addGroceryListPopup() {
            //grocery add button is pressed
            document.getElementById("grocery_list_form").style.display = "block";
        }

        function closeForm() {
            //closes the grocery add button popup
            document.getElementById("grocery_list_form").style.display = "none";
        }

        function add_item_buttonShow(title) {
            document.getElementById("add_item " + title).style.display = "block";
        }

        // function add_item_buttonClose() {
        //     document.getElementById("add_item_button").style.display = "block";
        // }

        function closeItemForm() {
            document.getElementById("list_item_form").style.display = "none";
        }

        function addItemToGroceryList(event, title) {
            event.preventDefault();
            const itemName = document.getElementById("itemName").value;
            let target_element = documen.getElementById("grocery-list " + title)
            // localStorage.setItem("currList", JSON.stringify());
            closeItemForm();
            target_element.innerHTML += `
            <ul>
                <li>
                    <h3>
                        <input type="checkbox" id="${itemName}_checkbox">&nbsp;&nbsp;${itemName}
                    </h3>
                </li>
            </ul>`;
        }

        function openAddForm(title) {
            let item_form = document.getElementById("list_item_form")
            item_form.style.display = "block";
            item_form.innerHTML = `<div class="form-popup" id="list_item_form">
           <form id="addItemForm" onsubmit="addItemToGroceryList(event, ${title})">
               <h1>Add Item To ${title}</h1>


               <label for="itemName"><b>Item Name:</b></label>
               <input type="text" id="itemName" placeholder="Enter Item Name" name="itemName" required><br>


               <button type="submit">Submit</button>
               <button type="button" onclick="closeItemForm()">Close</button>
           </form>
       </div>`;



        }

        function addGroceryList(event) {
            event.preventDefault(); //resets the form
            const title = document.getElementById("title").value;
            const date = document.getElementById("date").value;
            const groceryList = {
                title: title,
                date: date,
                items: []
            };
            localStorage.setItem("groceryLists", JSON.stringify(groceryList));
            console.log(groceryList);
            closeForm();

            document.getElementById("grocery_lists").innerHTML += `
            <div id="grocery ${title}">
                <h2><u>${title} added on: ${date}</u></h2>
                <div id="grocery-list ${title}">
                </div>
                <img id="add_item ${title}" src="/icons/add.png" width="25" height="25" onclick="openAddForm()">
            </div> 
            `;
            add_item_buttonShow(title);
            document.getElementById("form-container").reset();
        }
    </script>

    <!-- sample grocery list div, tso be added everytime someone adds a new list -->

    <div class="device">
        <div class="header">

        <div id="grocery_lists"></div>

        <!-- popup form for when the add list button is pressed -->
        <div class="form-popup" id="grocery_list_form">
            <form class="form-container" id="form-container" onsubmit="addGroceryList(event)">
                <h1>New List</h1>

                <label for="title"><b>Title</b></label>
                <input type="text" id="title" placeholder="Enter Title" name="title" required><br><br>

                <label for="date"><b>Date</b></label>
                <input type="date" id="date" placeholder="Enter Date" name="date" required><br><br>

                <button type="submit">Submit</button>
                <button type="button" onclick="closeForm()">Close</button>
            </form>
        </div>
